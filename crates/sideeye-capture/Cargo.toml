[package]
name = "sideeye-capture"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
description = "Capture adapters that normalize harness sessions into ReviewPacket"

[dependencies]
sideeye-core = { path = "../sideeye-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
