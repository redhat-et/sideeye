[package]
name = "sideeye-providers"
version = "0.6.1"
edition = "2024"
license = "Apache-2.0"
description = "Judge-provider boundary and deterministic test provider for Side-Eye"

[dependencies]
sideeye-core = { path = "../sideeye-core" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
