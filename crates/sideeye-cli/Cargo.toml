[package]
name = "sideeye-cli"
version = "0.6.17"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "sideeye"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
serde_json = "1"
sideeye-core = { path = "../sideeye-core" }
sideeye-capture = { path = "../sideeye-capture" }
sideeye-providers = { path = "../sideeye-providers" }
rpassword = "7"

[dev-dependencies]
tempfile = "3"
