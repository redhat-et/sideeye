[package]
name = "sideeye-cli"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "sideeye"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sideeye-core = { path = "../sideeye-core" }
sideeye-capture = { path = "../sideeye-capture" }
sideeye-providers = { path = "../sideeye-providers" }
