name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release -p sideeye-cli

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - run: python scripts/check_versions.py
      - run: python scripts/check_demo.py
      - run: python -m build --outdir dist

  opencode-plugin:
    name: OpenCode plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/opencode/package-lock.json
      - run: npm ci
        working-directory: integrations/opencode
      - run: npm run typecheck
        working-directory: integrations/opencode
      - run: npm run build
        working-directory: integrations/opencode
      - run: npm test
        working-directory: integrations/opencode
      - run: mkdir -p dist && npm pack --pack-destination dist
        working-directory: integrations/opencode
