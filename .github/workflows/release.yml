name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Version check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_versions.py "${GITHUB_REF_NAME}"

  rust:
    name: Rust ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: linux-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            arch: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - run: cargo build --release -p sideeye-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/sideeye" dist/sideeye
          tar -czf "sideeye-${{ matrix.arch }}.tar.gz" -C dist sideeye
          shasum -a 256 "sideeye-${{ matrix.arch }}.tar.gz" > "sideeye-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: sideeye-${{ matrix.arch }}
          path: |
            sideeye-${{ matrix.arch }}.tar.gz
            sideeye-${{ matrix.arch }}.tar.gz.sha256

  python:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  opencode-plugin:
    name: OpenCode plugin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/opencode/package-lock.json
      - run: npm ci
        working-directory: integrations/opencode
      - run: npm run build
        working-directory: integrations/opencode
      - run: mkdir -p dist && npm pack --pack-destination dist
        working-directory: integrations/opencode
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-plugin
          path: integrations/opencode/dist/*.tgz

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, rust, python, opencode-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
